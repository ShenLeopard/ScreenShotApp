name: Build and Release

permissions:
  contents: write

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore "./螢幕擷取工具/螢幕擷取工具/螢幕擷取工具.csproj"

    - name: Build project
      run: dotnet build "./螢幕擷取工具/螢幕擷取工具/螢幕擷取工具.csproj" --configuration Release

    - name: Publish app
      run: dotnet publish "./螢幕擷取工具/螢幕擷取工具/螢幕擷取工具.csproj" -c Release -r win-x64 --self-contained true -o publish_output

    # 安裝 7zip（比 Compress-Archive 穩定很多）
    - name: Install 7zip
      run: choco install 7zip -y

    # 以當前 timestamp 打包，避免日期異常
    - name: Create ZIP package
      run: 7z a ScreenCaptureTool.zip .\publish_output\*

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Release v1.0.${{ github.run_number }}
        files: ScreenCaptureTool.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
