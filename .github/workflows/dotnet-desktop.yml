name: Build and Release

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore ScreenShotApp.csproj

    - name: Build project
      run: dotnet build ScreenShotApp.csproj --configuration Release

    - name: Publish app
      run: dotnet publish ScreenShotApp.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeAllContentForSelfExtract=true -o publish_output

    - name: Zip output
      run: Compress-Archive -Path publish_output/* -DestinationPath MyApp.zip

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: MyApp.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
