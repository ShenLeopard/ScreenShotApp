name: Build and Release

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v3

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build project
      run: dotnet build --configuration Release --no-restore

    - name: Publish application
      run: dotnet publish -c Release -r win-x64 -p:PublishSingleFile=true -p:IncludeAllContentForSelfExtract=true -p:PublishTrimmed=false --self-contained true -o publish_output

    - name: Compress output
      run: Compress-Archive -Path publish_output/* -DestinationPath MyApp.zip

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: MyApp.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
