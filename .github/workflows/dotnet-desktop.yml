name: Build and Release

permissions:
  contents: write

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore "./螢幕擷取工具/螢幕擷取工具/螢幕擷取工具.csproj"

    - name: Build project
      run: dotnet build "./螢幕擷取工具/螢幕擷取工具/螢幕擷取工具.csproj" --configuration Release

    - name: Publish app
      run: dotnet publish "./螢幕擷取工具/螢幕擷取工具/螢幕擷取工具.csproj" -c Release -r win-x64 --self-contained true -o publish_output

    - name: Zip output
      run: Compress-Archive -Path publish_output/* -DestinationPath MyApp.zip

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        files: MyApp.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
